[project]
name = "backend"
version = "0.1.0"
description = "Kanzlei-KI backend: ingestion, RAG chat API, review queue, eval harness"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastembed>=0.8.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "qdrant-client>=1.19.1",
    "sentence-transformers>=6.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
